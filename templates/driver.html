{% extends "base.html" %}{% block content %}<h1>Driver Dashboard</h1><div class="card"><h3>Live GPS</h3><button class="btn" onclick="startGPS()">Start sharing location</button><p id="gps">GPS not started.</p></div>{% for o in orders %}<div class="card"><h3>{{o.order_no}}</h3><p>{{o.business_name}} → {{o.delivery_address}}</p><form method="post" action="/driver/update/{{o.id}}"><select name="status"><option>Accepted</option><option>Preparing</option><option>Picked Up</option><option>On the Way</option><option>Delivered</option></select><button class="btn">Update</button></form></div>{% endfor %}<script>function startGPS(){if(!navigator.geolocation)return alert('GPS unavailable');navigator.geolocation.watchPosition(async p=>{document.getElementById('gps').innerText='Location sharing active';await fetch('/driver/location',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({lat:p.coords.latitude,lon:p.coords.longitude})})},e=>alert(e.message),{enableHighAccuracy:true,maximumAge:3000,timeout:10000})}</script>{% endblock %}
