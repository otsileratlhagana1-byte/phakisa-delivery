{% extends "base.html" %}{% block content %}<div class="hero"><h1>{{business.name}}</h1><p>{{business.description}}</p></div><div class="grid">{% for p in products %}<div class="card"><h3>{{p.name}}</h3><b>R{{"%.2f"|format(p.price)}}</b><br><br><button class="btn" onclick='add({{p.id}},"{{p.name|replace('"','')}}",{{p.price}})'>Add</button></div>{% endfor %}</div><div class="cartbar"><span id="summary">Cart: 0 items</span><button class="btn" onclick="checkout()">Checkout</button></div><div id="checkout" class="card" style="display:none"><h2>Delivery</h2><form method="post" action="/order"><input type="hidden" name="business_id" value="{{business.id}}"><input type="hidden" id="items" name="items"><label>Delivery address</label><textarea name="address" required></textarea><label>Payment</label><select name="payment_method"><option>Cash on Delivery</option><option>Online Payment (connect gateway)</option></select><button class="btn">Place Order</button></form></div><script>let cart=[];function add(id,name,price){let x=cart.find(a=>a.id==id);if(x)x.qty++;else cart.push({id,name,price,qty:1});document.getElementById('summary').innerText='Cart: '+cart.reduce((s,x)=>s+x.qty,0)+' items'}function checkout(){if(!cart.length)return alert('Add a product first');document.getElementById('items').value=JSON.stringify(cart);document.getElementById('checkout').style.display='block';scrollTo(0,document.body.scrollHeight)}</script>{% endblock %}
