{% extends "base.html" %}{% block content %}<div class="card"><h2>Register your business</h2><form method="post"><input name="name" value="{{business.name if business else ''}}" placeholder="Business name" required><input name="category" value="{{business.category if business else ''}}" placeholder="Restaurant / Shop / Salon" required><input name="address" value="{{business.address if business else ''}}" placeholder="Business address" required><input name="phone" value="{{business.phone if business else ''}}" placeholder="Phone" required><textarea name="description" placeholder="Description">{{business.description if business else ''}}</textarea><div class="grid"><input name="lat" placeholder="Latitude (optional)"><input name="lon" placeholder="Longitude (optional)"></div><button class="btn">Save Business</button></form></div>{% endblock %}
